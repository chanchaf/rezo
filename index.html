<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="REZO — trouve et organise des rencontres par activité, près de toi, à l'instant." />
    <meta name="theme-color" content="#F0F2F5" />
    <meta name="color-scheme" content="light" />

    <!-- PWA / mobile home screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="REZO" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    />

    <title>REZO · Rencontres par activité</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restaure le chemin réel avant le premier rendu si on arrive via le rebond de public/404.html
      // (rechargement direct sur /conditions-utilisation ou /politique-confidentialite) — sans quoi
      // main.jsx lirait "/" et afficherait l'app normale au lieu de la page légale demandée.
      (function () {
        var path = sessionStorage.getItem('rezo-redirect-path');
        if (path) {
          sessionStorage.removeItem('rezo-redirect-path');
          if (path !== '/') history.replaceState(null, '', path);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
